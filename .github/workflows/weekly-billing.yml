name: Automatic Friday childcare billing
on:
  schedule:
    # 18:00 UTC = 12 PM CST / 1 PM CDT; script verifies local Friday.
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test only — do not save charges'
        required: true
        type: boolean
        default: true
jobs:
  bill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify birthday and duplicate rules (no database writes)
        run: node scripts/weekly-billing.mjs
        env:
          BILLING_SELF_TEST: 'true'
      - run: node scripts/weekly-billing.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BILLING_USER_ID: ${{ secrets.BILLING_USER_ID }}
          BILLING_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
          BILLING_LIVE_APPROVED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
